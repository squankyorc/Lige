name: Voxel foundation checks

on:
  push:
    branches: [main, feature/voxel-513-godot-luanti]
    paths:
      - 'godot_voxel/**'
      - 'luanti/**'
      - '.github/workflows/voxel-base.yml'
  pull_request:
    paths:
      - 'godot_voxel/**'
      - 'luanti/**'
      - '.github/workflows/voxel-base.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  luanti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Syntax-check Luanti scripts
        run: |
          luac -p luanti/games/voxel_base/mods/voxel_base/init.lua
          luac -p luanti/games/voxel_base/mods/voxel_base/terrain.lua
          luac -p luanti/tests/terrain_test.lua
      - name: Terrain contract tests
        run: lua luanti/tests/terrain_test.lua

  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot headless
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Import project and register script classes
        run: godot --headless --path godot_voxel --editor --import --quit
      - name: World limits and block edit tests
        timeout-minutes: 2
        run: godot --headless --path godot_voxel --script res://tests/world_test.gd
      - name: Start main scene briefly
        run: godot --headless --path godot_voxel --quit-after 10
